<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📖 Qur'on Tafsirlari</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f4f6fa;
            color: #1e293b;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.07);
            padding: 2rem 2rem 2.5rem;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid #eef2f6;
            padding-bottom: 1.25rem;
            flex-wrap: wrap;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #0f2b3d, #1e4a6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .badge {
            margin-left: auto;
            font-size: 0.75rem;
            background: #eef2f6;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            color: #475569;
            font-weight: 500;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem 1.2rem;
            margin-bottom: 2rem;
            background: #f1f5f9;
            padding: 1.2rem 1.5rem;
            border-radius: 1.25rem;
            align-items: flex-end;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            flex: 1 1 180px;
            min-width: 140px;
        }

        .control-group label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 0.25rem;
        }

        .control-group select,
        .control-group input {
            padding: 0.6rem 0.8rem;
            border: 1px solid #d1d9e6;
            border-radius: 0.75rem;
            font-size: 0.95rem;
            background: white;
            transition: 0.15s;
            font-family: inherit;
            color: #0f172a;
            width: 100%;
        }

        .control-group select:focus,
        .control-group input:focus {
            outline: none;
            border-color: #1e4a6b;
            box-shadow: 0 0 0 3px rgba(30, 74, 107, 0.15);
        }

        .btn-primary {
            background: #1e4a6b;
            color: white;
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            align-self: flex-end;
            height: 42px;
            white-space: nowrap;
            font-family: inherit;
        }

        .btn-primary:hover {
            background: #143647;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(30, 74, 107, 0.2);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 0.25rem;
            font-size: 0.9rem;
            color: #475569;
            min-height: 1.6rem;
        }

        .status .loading {
            color: #1e4a6b;
            font-weight: 500;
        }

        .status .error {
            color: #b91c1c;
            background: #fef2f2;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            display: inline-block;
        }

        .meta-info {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem 2rem;
            background: #f8fafc;
            padding: 0.8rem 1.2rem;
            border-radius: 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            border: 1px solid #e9edf3;
        }

        .meta-info strong {
            color: #0f172a;
            font-weight: 600;
        }

        .tafsir-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .tafsir-item {
            background: #fafcff;
            border-radius: 1rem;
            padding: 1.2rem 1.5rem;
            border-left: 5px solid #1e4a6b;
            border: 1px solid #eef2f6;
            border-left-width: 5px;
        }

        .tafsir-item .ayah-number {
            display: inline-block;
            font-weight: 700;
            font-size: 0.8rem;
            background: #1e4a6b;
            color: white;
            padding: 0.15rem 0.7rem;
            border-radius: 40px;
            margin-bottom: 0.5rem;
        }

        .tafsir-item .ayah-text {
            font-size: 1rem;
            line-height: 1.8;
            color: #1e293b;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .tafsir-item .ayah-text::before {
            content: "⸻ ";
            color: #94a3b8;
            font-weight: 300;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #94a3b8;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .footer {
            margin-top: 2.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid #e9edf3;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
        }

        .footer a {
            color: #1e4a6b;
            text-decoration: none;
        }

        @media (max-width: 640px) {
            .app {
                padding: 1.25rem;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-primary {
                align-self: stretch;
                margin-top: 0.25rem;
            }
            .header h1 {
                font-size: 1.4rem;
            }
            .tafsir-item {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <div class="header">
            <h1>📖 Qur'on Tafsirlari</h1>
            <span class="badge">Bepul API · 100+ tafsir</span>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="editionSelect">📚 Tafsir nashri</label>
                <select id="editionSelect">
                    <option value="">Yuklanmoqda…</option>
                </select>
            </div>

            <div class="control-group">
                <label for="surahInput">🔢 Surah raqami (1–114)</label>
                <input type="number" id="surahInput" min="1" max="114" placeholder="mas. 1" value="1" />
            </div>

            <button class="btn-primary" id="fetchBtn">📥 Yuklash</button>
        </div>

        <div class="status" id="status">Tafsir nashri va surahni tanlab, «Yuklash» tugmasini bosing.</div>

        <div class="meta-info">
            <span><strong>Nashr:</strong> <span id="metaEdition">—</span></span>
            <span><strong>Surah:</strong> <span id="metaSurah">—</span></span>
            <span><strong>Oyatlar soni:</strong> <span id="metaAyahs">—</span></span>
        </div>

        <div id="tafsirContainer">
            <div class="empty-state">
                <div class="icon">🕌</div>
                <p>Tafsirni ko‘rish uchun yuqoridagi maydonlarni to‘ldiring.</p>
            </div>
        </div>

        <div class="footer">
            Maʼlumotlar <a href="https://github.com/auzmedia/tafsir_api" target="_blank" rel="noopener">auzmedia/tafsir_api</a> dan olindi.
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---- DOM elementlar ----
            const editionSelect = document.getElementById('editionSelect');
            const surahInput = document.getElementById('surahInput');
            const fetchBtn = document.getElementById('fetchBtn');
            const statusEl = document.getElementById('status');
            const metaEdition = document.getElementById('metaEdition');
            const metaSurah = document.getElementById('metaSurah');
            const metaAyahs = document.getElementById('metaAyahs');
            const tafsirContainer = document.getElementById('tafsirContainer');

            // ---- API manzili (siz ko‘rsatgan repo) ----
            const BASE_URL = 'https://cdn.jsdelivr.net/gh/auzmedia/tafsir_api@main/tafsir';

            // ---- O‘zbekcha surah nomlari ----
            const SURAH_NAMES_UZ = [
                '', 'Al-Fotiha', 'Baqara', 'Oli Imron', 'Niso', 'Moida',
                'An\'om', 'A\'rof', 'Anfol', 'Tavba', 'Yunus', 'Hud', 'Yusuf',
                'Ra\'d', 'Ibrohim', 'Hijr', 'Nahl', 'Isro', 'Kahf', 'Maryam',
                'Toha', 'Anbiyo', 'Haj', 'Mo\'minun', 'Nur', 'Furqon',
                'Shu\'aro', 'Naml', 'Qasos', 'Ankabut', 'Rum', 'Luqmon',
                'Sajda', 'Ahzob', 'Saba', 'Fotir', 'Yosin', 'Saffot', 'Sod',
                'Zumar', 'G\'ofir', 'Fussilat', 'Sho\'ro', 'Zuxruf', 'Duxon',
                'Josiya', 'Ahqof', 'Muhammad', 'Fath', 'Hujurot', 'Qof',
                'Zoriyot', 'Tur', 'Najm', 'Qamar', 'Rahmon', 'Voqea',
                'Hadid', 'Mujodala', 'Hashr', 'Mumtahina', 'Saff', 'Jum\'a',
                'Munofiqun', 'Tag\'obun', 'Taloq', 'Tahrim', 'Mulk', 'Qalam',
                'Hoqqa', 'Ma\'orij', 'Nuh', 'Jin', 'Muzzammil', 'Muddassir',
                'Qiyomat', 'Inson', 'Mursalot', 'Naba', 'Naziat', 'Abasa',
                'Takvir', 'Infitor', 'Mutaffifin', 'Inshiqoq', 'Buruj', 'Toriq',
                'A\'lo', 'G\'oshiya', 'Fajr', 'Balad', 'Shams', 'Layl',
                'Zuho', 'Sharh', 'Tin', 'Alaq', 'Qadr', 'Bayyina',
                'Zilzol', 'Adiyat', 'Qori\'a', 'Takosur', 'Asr',
                'Humaza', 'Fil', 'Quraysh', 'Ma\'un', 'Kavsar', 'Kofirun',
                'Nasr', 'Masad', 'Ixlos', 'Falaq', 'Nos'
            ];

            // ---- Holatni yangilash ----
            function setStatus(xabar, xato = false) {
                statusEl.innerHTML = xabar;
                statusEl.className = 'status';
                if (xato) statusEl.classList.add('error');
                else if (xabar.includes('Yuklanmoqda')) statusEl.classList.add('loading');
            }

            // ---- Bo‘shatish ----
            function renderEmpty() {
                tafsirContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🕌</div>
                        <p>Tafsir ko‘rish uchun sozlamalarni tanlang.</p>
                    </div>
                `;
                metaEdition.textContent = '—';
                metaSurah.textContent = '—';
                metaAyahs.textContent = '—';
            }

            // ---- Tafsirlar ro‘yxatini yuklash ----
            async function loadEditions() {
                try {
                    setStatus('⏳ Tafsir nashrlari yuklanmoqda…');
                    const resp = await fetch(`${BASE_URL}/editions.json`);
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const editions = await resp.json();

                    editions.sort((a, b) => a.language_name.localeCompare(b.language_name) || a.name.localeCompare(b.name));

                    editionSelect.innerHTML = '';
                    let firstSlug = null;

                    editions.forEach((ed) => {
                        const opt = document.createElement('option');
                        opt.value = ed.slug;
                        opt.textContent = `${ed.name} (${ed.language_name}) — ${ed.author_name}`;
                        editionSelect.appendChild(opt);
                        if (!firstSlug) firstSlug = ed.slug;
                    });

                    if (firstSlug) editionSelect.value = firstSlug;

                    setStatus(`✅ ${editions.length} ta tafsir nashri yuklandi.`);

                    // Yuklangandan so‘ng avtomatik ravishda 1-surahni ko‘rsatish
                    if (editionSelect.value && surahInput.value) {
                        fetchTafsir(editionSelect.value, surahInput.value.trim());
                    }

                    return editions;
                } catch (err) {
                    console.error(err);
                    setStatus('❌ Tafsirlarni yuklashda xatolik. Sahifani yangilang.', true);
                    editionSelect.innerHTML = '<option value="">Xatolik yuz berdi</option>';
                }
            }

            // ---- Tafsirni olish va ko‘rsatish ----
            async function fetchTafsir(slug, surahNumber) {
                if (!slug) {
                    setStatus('⚠️ Iltimos, tafsir nashrini tanlang.', true);
                    return;
                }

                const surah = parseInt(surahNumber, 10);
                if (isNaN(surah) || surah < 1 || surah > 114) {
                    setStatus('⚠️ Surah raqami 1 dan 114 gacha bo‘lishi kerak.', true);
                    return;
                }

                fetchBtn.disabled = true;
                setStatus(`⏳ Surah ${surah} tafsiri yuklanmoqda…`);

                try {
                    const url = `${BASE_URL}/${slug}/${surah}.json`;
                    const resp = await fetch(url);

                    if (!resp.ok) {
                        if (resp.status === 404) throw new Error(`Bu nashrda ${surah}-surah tafsiri mavjud emas.`);
                        throw new Error(`HTTP ${resp.status}`);
                    }

                    const data = await resp.json();
                    if (!data.ayahs || data.ayahs.length === 0) {
                        throw new Error('Hech qanday oyat topilmadi.');
                    }

                    const ayahs = data.ayahs;

                    // Metama'lumot
                    const editionName = editionSelect.options[editionSelect.selectedIndex]?.text.split(' (')[0] || slug;
                    metaEdition.textContent = editionName;
                    metaSurah.textContent = `${surah}. ${SURAH_NAMES_UZ[surah] || 'Surah'}`;
                    metaAyahs.textContent = ayahs.length;

                    // HTML yasash
                    let html = '<div class="tafsir-list">';
                    ayahs.forEach((item) => {
                        const matn = item.text || '(Tafsir matni mavjud emas)';
                        html += `
                            <div class="tafsir-item">
                                <span class="ayah-number">⚬ Oyat ${item.ayah}</span>
                                <div class="ayah-text">${matn}</div>
                            </div>
                        `;
                    });
                    html += '</div>';

                    tafsirContainer.innerHTML = html;
                    setStatus(`✅ ${ayahs.length} ta oyat ko‘rsatilmoqda.`);

                } catch (err) {
                    console.error(err);
                    setStatus(`❌ ${err.message}`, true);
                    tafsirContainer.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">⚠️</div>
                            <p>${err.message}</p>
                            <p style="font-size:0.85rem; color:#94a3b8;">Boshqa nashr yoki surahni sinab ko‘ring.</p>
                        </div>
                    `;
                    metaEdition.textContent = editionSelect.options[editionSelect.selectedIndex]?.text.split(' (')[0] || slug;
                    metaSurah.textContent = `${surah}. ${SURAH_NAMES_UZ[surah] || ''}`;
                    metaAyahs.textContent = '—';
                } finally {
                    fetchBtn.disabled = false;
                }
            }

            // ---- Voqealar (Events) ----
            fetchBtn.addEventListener('click', () => {
                fetchTafsir(editionSelect.value, surahInput.value.trim());
            });

            surahInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    fetchBtn.click();
                }
            });

            // Nashr o‘zgarganda avtomatik yuklash (agar surah kiritilgan bo‘lsa)
            editionSelect.addEventListener('change', () => {
                if (surahInput.value.trim()) fetchBtn.click();
            });

            // ---- Ishga tushirish ----
            renderEmpty();
            loadEditions();

        })();
    </script>

</body>
</html>
