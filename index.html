<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📖 Qur'on Tafsirlari – Ro'yxat va Izlash</title>

    <style>
        /* ===== GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f1f4f9;
            color: #1e293b;
            padding: 1rem;
            min-height: 100vh;
        }

        .app {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 85vh;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem 2rem;
            background: #ffffff;
            border-bottom: 1px solid #e9edf3;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #0f2b3d, #1e4a6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .badge {
            font-size: 0.7rem;
            background: #eef2f6;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            color: #475569;
            font-weight: 500;
        }

        /* ===== MAIN LAYOUT (2 columns) ===== */
        .main-layout {
            display: flex;
            flex: 1;
            min-height: 600px;
        }

        /* ===== SIDEBAR (Surah list) ===== */
        .sidebar {
            width: 300px;
            min-width: 260px;
            background: #fafcff;
            border-right: 1px solid #e9edf3;
            padding: 1.2rem 1rem;
            display: flex;
            flex-direction: column;
            max-height: 80vh;
            overflow: hidden;
        }

        .sidebar .control-group {
            margin-bottom: 0.75rem;
        }

        .sidebar label {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 600;
            color: #64748b;
            display: block;
            margin-bottom: 0.2rem;
        }

        .sidebar select,
        .sidebar input[type="text"] {
            width: 100%;
            padding: 0.5rem 0.7rem;
            border: 1px solid #d1d9e6;
            border-radius: 0.6rem;
            font-size: 0.9rem;
            font-family: inherit;
            background: white;
            transition: 0.15s;
        }

        .sidebar select:focus,
        .sidebar input:focus {
            outline: none;
            border-color: #1e4a6b;
            box-shadow: 0 0 0 3px rgba(30, 74, 107, 0.12);
        }

        .surah-list-container {
            flex: 1;
            overflow-y: auto;
            margin-top: 0.5rem;
            border-top: 1px solid #eef2f6;
            padding-top: 0.5rem;
        }

        .surah-list-container::-webkit-scrollbar {
            width: 4px;
        }
        .surah-list-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }

        .surah-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.7rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: 0.1s;
            border-left: 3px solid transparent;
            margin-bottom: 2px;
            font-size: 0.9rem;
        }

        .surah-item:hover {
            background: #eef4fa;
        }

        .surah-item.active {
            background: #1e4a6b;
            color: white;
            border-left-color: #facc15;
        }

        .surah-item .num {
            font-weight: 600;
            opacity: 0.6;
            min-width: 30px;
            font-size: 0.8rem;
        }

        .surah-item.active .num {
            opacity: 0.9;
        }

        .surah-item .name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .surah-item .ayah-count {
            margin-left: auto;
            font-size: 0.7rem;
            opacity: 0.5;
            background: #e9edf3;
            padding: 0.1rem 0.5rem;
            border-radius: 20px;
        }

        .surah-item.active .ayah-count {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .no-result {
            padding: 1.5rem 0.5rem;
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        /* ===== CONTENT (Tafsir panel) ===== */
        .content {
            flex: 1;
            padding: 1.5rem 2rem 2rem;
            overflow-y: auto;
            max-height: 80vh;
            background: white;
        }

        .content .status {
            font-size: 0.9rem;
            color: #475569;
            min-height: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .content .status .loading {
            color: #1e4a6b;
            font-weight: 500;
        }
        .content .status .error {
            color: #b91c1c;
            background: #fef2f2;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            display: inline-block;
        }

        /* Search inside tafsir */
        .tafsir-search-box {
            margin-bottom: 1.2rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .tafsir-search-box input {
            flex: 1;
            min-width: 180px;
            padding: 0.5rem 0.8rem;
            border: 1px solid #d1d9e6;
            border-radius: 0.6rem;
            font-size: 0.9rem;
            font-family: inherit;
            background: #f8fafc;
            transition: 0.15s;
        }

        .tafsir-search-box input:focus {
            outline: none;
            border-color: #1e4a6b;
            background: white;
            box-shadow: 0 0 0 3px rgba(30, 74, 107, 0.08);
        }

        .tafsir-search-box .clear-btn {
            background: #eef2f6;
            border: none;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            cursor: pointer;
            color: #475569;
            font-weight: 500;
            transition: 0.1s;
        }

        .tafsir-search-box .clear-btn:hover {
            background: #d1d9e6;
        }

        /* Meta info */
        .meta-info {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem 2rem;
            background: #f8fafc;
            padding: 0.7rem 1.2rem;
            border-radius: 0.8rem;
            margin-bottom: 1.5rem;
            border: 1px solid #e9edf3;
            font-size: 0.9rem;
        }

        .meta-info strong {
            color: #0f172a;
            font-weight: 600;
        }

        /* Tafsir items */
        .tafsir-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .tafsir-item {
            background: #fafcff;
            border-radius: 0.8rem;
            padding: 1rem 1.3rem;
            border: 1px solid #eef2f6;
            border-left: 4px solid #1e4a6b;
            transition: 0.15s;
        }

        .tafsir-item.hidden-by-search {
            display: none;
        }

        .tafsir-item .ayah-number {
            display: inline-block;
            font-weight: 700;
            font-size: 0.75rem;
            background: #1e4a6b;
            color: white;
            padding: 0.1rem 0.6rem;
            border-radius: 40px;
            margin-bottom: 0.35rem;
        }

        .tafsir-item .ayah-text {
            font-size: 0.95rem;
            line-height: 1.8;
            color: #1e293b;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .tafsir-item .ayah-text .highlight {
            background: #fef08a;
            padding: 0.1rem 0.2rem;
            border-radius: 4px;
            font-weight: 500;
        }

        .tafsir-item .ayah-text::before {
            content: "⸻ ";
            color: #94a3b8;
            font-weight: 300;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #94a3b8;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        /* ===== FOOTER ===== */
        .footer {
            padding: 1rem 2rem;
            border-top: 1px solid #e9edf3;
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
            background: #fafcff;
        }
        .footer a {
            color: #1e4a6b;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 820px) {
            .main-layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: unset;
                border-right: none;
                border-bottom: 1px solid #e9edf3;
                max-height: 320px;
                padding: 1rem;
            }

            .content {
                max-height: unset;
                padding: 1.2rem;
            }

            .header h1 {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 480px) {
            .app {
                border-radius: 0.8rem;
            }
            .header {
                padding: 0.8rem 1rem;
            }
            .sidebar {
                padding: 0.8rem;
                max-height: 280px;
            }
            .content {
                padding: 1rem;
            }
            .tafsir-item {
                padding: 0.8rem 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <h1>📖 Qur'on Tafsirlari</h1>
            <span class="badge">114 sura · ro‘yxat + izlash</span>
        </div>

        <!-- ===== MAIN LAYOUT ===== -->
        <div class="main-layout">

            <!-- ===== SIDEBAR: Surah list with search ===== -->
            <div class="sidebar">
                <div class="control-group">
                    <label for="editionSelect">📚 Tafsir nashri</label>
                    <select id="editionSelect">
                        <option value="">Yuklanmoqda…</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="surahSearch">🔍 Surah qidirish (nom/raqam)</label>
                    <input type="text" id="surahSearch" placeholder="Mas: 2 yoki Baqara" />
                </div>

                <div class="surah-list-container" id="surahListContainer">
                    <!-- JavaScript to‘ldiradi -->
                    <div class="no-result">Yuklanmoqda...</div>
                </div>
            </div>

            <!-- ===== CONTENT: Tafsir display with search ===== -->
            <div class="content" id="contentPanel">
                <!-- Status -->
                <div class="status" id="status">Tafsir ko‘rish uchun surani bosing.</div>

                <!-- Search inside tafsir -->
                <div class="tafsir-search-box">
                    <input type="text" id="tafsirSearch" placeholder="📝 Tafsir matnidan qidirish..." />
                    <button class="clear-btn" id="clearTafsirSearch">Tozalash</button>
                </div>

                <!-- Meta info -->
                <div class="meta-info" id="metaInfo">
                    <span><strong>Nashr:</strong> <span id="metaEdition">—</span></span>
                    <span><strong>Surah:</strong> <span id="metaSurah">—</span></span>
                    <span><strong>Oyatlar:</strong> <span id="metaAyahs">—</span></span>
                </div>

                <!-- Tafsir container -->
                <div id="tafsirContainer">
                    <div class="empty-state">
                        <div class="icon">🕌</div>
                        <p>Chapdagi ro‘yxatdan biror surani bosing.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            Maʼlumotlar <a href="https://github.com/auzmedia/tafsir_api" target="_blank" rel="noopener">auzmedia/tafsir_api</a> dan olindi.
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---- DOM elementlar ----
            const editionSelect = document.getElementById('editionSelect');
            const surahSearch = document.getElementById('surahSearch');
            const surahListContainer = document.getElementById('surahListContainer');
            const tafsirSearch = document.getElementById('tafsirSearch');
            const clearTafsirBtn = document.getElementById('clearTafsirSearch');
            const statusEl = document.getElementById('status');
            const metaEdition = document.getElementById('metaEdition');
            const metaSurah = document.getElementById('metaSurah');
            const metaAyahs = document.getElementById('metaAyahs');
            const tafsirContainer = document.getElementById('tafsirContainer');

            // ---- API manzili ----
            const BASE_URL = 'https://cdn.jsdelivr.net/gh/auzmedia/tafsir_api@main/tafsir';

            // ---- O‘zbekcha 114 sura nomi ----
            const SURAH_NAMES_UZ = [
                '', 'Al-Fotiha', 'Baqara', 'Oli Imron', 'Niso', 'Moida',
                'An\'om', 'A\'rof', 'Anfol', 'Tavba', 'Yunus', 'Hud', 'Yusuf',
                'Ra\'d', 'Ibrohim', 'Hijr', 'Nahl', 'Isro', 'Kahf', 'Maryam',
                'Toha', 'Anbiyo', 'Haj', 'Mo\'minun', 'Nur', 'Furqon',
                'Shu\'aro', 'Naml', 'Qasos', 'Ankabut', 'Rum', 'Luqmon',
                'Sajda', 'Ahzob', 'Saba', 'Fotir', 'Yosin', 'Saffot', 'Sod',
                'Zumar', 'G\'ofir', 'Fussilat', 'Sho\'ro', 'Zuxruf', 'Duxon',
                'Josiya', 'Ahqof', 'Muhammad', 'Fath', 'Hujurot', 'Qof',
                'Zoriyot', 'Tur', 'Najm', 'Qamar', 'Rahmon', 'Voqea',
                'Hadid', 'Mujodala', 'Hashr', 'Mumtahina', 'Saff', 'Jum\'a',
                'Munofiqun', 'Tag\'obun', 'Taloq', 'Tahrim', 'Mulk', 'Qalam',
                'Hoqqa', 'Ma\'orij', 'Nuh', 'Jin', 'Muzzammil', 'Muddassir',
                'Qiyomat', 'Inson', 'Mursalot', 'Naba', 'Naziat', 'Abasa',
                'Takvir', 'Infitor', 'Mutaffifin', 'Inshiqoq', 'Buruj', 'Toriq',
                'A\'lo', 'G\'oshiya', 'Fajr', 'Balad', 'Shams', 'Layl',
                'Zuho', 'Sharh', 'Tin', 'Alaq', 'Qadr', 'Bayyina',
                'Zilzol', 'Adiyat', 'Qori\'a', 'Takosur', 'Asr',
                'Humaza', 'Fil', 'Quraysh', 'Ma\'un', 'Kavsar', 'Kofirun',
                'Nasr', 'Masad', 'Ixlos', 'Falaq', 'Nos'
            ];

            // ---- Holat ----
            let currentEdition = null;
            let currentSurah = 1;
            let allEditions = [];
            let ayahsData = [];

            // ---- Yordamchi: matnni xavfsiz chiqarish ----
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ---- Status ----
            function setStatus(msg, isError = false) {
                statusEl.innerHTML = msg;
                statusEl.className = 'status';
                if (isError) statusEl.classList.add('error');
                else if (msg.includes('Yuklanmoqda')) statusEl.classList.add('loading');
            }

            // ---- Surah ro‘yxatini chizish ----
            function renderSurahList(filterText = '') {
                const q = filterText.trim().toLowerCase();
                let html = '';

                for (let i = 1; i <= 114; i++) {
                    const name = SURAH_NAMES_UZ[i] || `Surah ${i}`;
                    const match = (i.toString() === q) || name.toLowerCase().includes(q) || q === '';
                    if (!match) continue;

                    const active = (i === currentSurah) ? 'active' : '';
                    html += `
                        <div class="surah-item ${active}" data-surah="${i}">
                            <span class="num">${i}</span>
                            <span class="name">${name}</span>
                            <span class="ayah-count">—</span>
                        </div>
                    `;
                }

                if (!html) {
                    html = `<div class="no-result">❌ «${escapeHtml(filterText)}» bo‘yicha sura topilmadi.</div>`;
                }

                surahListContainer.innerHTML = html;

                // Har bir sura ustiga click event
                document.querySelectorAll('.surah-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const surah = parseInt(this.dataset.surah, 10);
                        if (!isNaN(surah) && surah !== currentSurah) {
                            currentSurah = surah;
                            // Ixtiyoriy: qidiruv maydonini tozalab, sura nomini ko‘rsatish
                            // Surah raqamini inputga yozamiz (yoki yo‘q)
                            fetchTafsir(editionSelect.value, surah);
                            // Ro‘yxatni yangilab, aktiv holatni ko‘rsatish
                            renderSurahList(surahSearch.value);
                            // Aktiv elementga skroll qilish
                            const activeEl = document.querySelector('.surah-item.active');
                            if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
                        }
                    });
                });
            }

            // ---- Tafsirni yuklash va ko‘rsatish ----
            async function fetchTafsir(slug, surahNumber) {
                if (!slug) {
                    setStatus('⚠️ Iltimos, tafsir nashrini tanlang.', true);
                    return;
                }

                const surah = parseInt(surahNumber, 10);
                if (isNaN(surah) || surah < 1 || surah > 114) {
                    setStatus('⚠️ Surah raqami 1–114 oralig‘ida bo‘lishi kerak.', true);
                    return;
                }

                currentSurah = surah;
                setStatus(`⏳ Surah ${surah} tafsiri yuklanmoqda…`);
                tafsirContainer.innerHTML = `<div class="empty-state"><div class="icon">⏳</div><p>Yuklanmoqda...</p></div>`;

                try {
                    const url = `${BASE_URL}/${slug}/${surah}.json`;
                    const resp = await fetch(url);
                    if (!resp.ok) {
                        if (resp.status === 404) throw new Error(`Bu nashrda ${surah}-surah tafsiri mavjud emas.`);
                        throw new Error(`HTTP ${resp.status}`);
                    }

                    const data = await resp.json();
                    if (!data.ayahs || data.ayahs.length === 0) {
                        throw new Error('Hech qanday oyat tafsiri topilmadi.');
                    }

                    ayahsData = data.ayahs;

                    // Meta ma'lumot
                    const editionName = editionSelect.options[editionSelect.selectedIndex]?.text.split(' (')[0] || slug;
                    metaEdition.textContent = editionName;
                    metaSurah.textContent = `${surah}. ${SURAH_NAMES_UZ[surah] || 'Surah'}`;
                    metaAyahs.textContent = ayahsData.length;

                    // Tafsir matnini chizish
                    renderTafsir(tafsirSearch.value);

                    setStatus(`✅ ${ayahsData.length} ta oyat ko‘rsatilmoqda.`);
                    renderSurahList(surahSearch.value); // ro‘yxatdagi aktivlikni yangilash

                } catch (err) {
                    console.error(err);
                    setStatus(`❌ ${err.message}`, true);
                    tafsirContainer.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">⚠️</div>
                            <p>${escapeHtml(err.message)}</p>
                            <p style="font-size:0.85rem; color:#94a3b8;">Boshqa nashr yoki surani sinab ko‘ring.</p>
                        </div>
                    `;
                    metaEdition.textContent = editionSelect.options[editionSelect.selectedIndex]?.text.split(' (')[0] || slug;
                    metaSurah.textContent = `${surah}. ${SURAH_NAMES_UZ[surah] || ''}`;
                    metaAyahs.textContent = '—';
                }
            }

            // ---- Tafsirni chizish + matn ichida qidirish ----
            function renderTafsir(searchTerm = '') {
                const term = searchTerm.trim().toLowerCase();
                let html = '<div class="tafsir-list">';

                ayahsData.forEach((item) => {
                    const text = item.text || '(Tafsir matni mavjud emas)';
                    let displayText = escapeHtml(text);
                    let match = false;

                    if (term) {
                        const lowerText = text.toLowerCase();
                        if (lowerText.includes(term)) {
                            match = true;
                            // Highlight qilish
                            const regex = new RegExp(`(${escapeHtml(term)})`, 'gi');
                            displayText = displayText.replace(regex, '<span class="highlight">$1</span>');
                        }
                    } else {
                        match = true; // qidiruv yo‘q, hammasini ko‘rsat
                    }

                    const hiddenClass = match ? '' : 'hidden-by-search';
                    html += `
                        <div class="tafsir-item ${hiddenClass}">
                            <span class="ayah-number">⚬ Oyat ${item.ayah}</span>
                            <div class="ayah-text">${displayText}</div>
                        </div>
                    `;
                });

                html += '</div>';

                if (!ayahsData.length) {
                    html = `<div class="empty-state"><div class="icon">📭</div><p>Hozircha tafsir mavjud emas.</p></div>`;
                }

                tafsirContainer.innerHTML = html;

                // Agar qidiruv natijasida hech narsa topilmasa, xabar chiqaramiz
                if (term && !document.querySelector('.tafsir-item:not(.hidden-by-search)')) {
                    const emptyMsg = document.createElement('div');
                    emptyMsg.className = 'empty-state';
                    emptyMsg.innerHTML = `<div class="icon">🔍</div><p>«${escapeHtml(term)}» matn ichida topilmadi.</p>`;
                    tafsirContainer.innerHTML = '';
                    tafsirContainer.appendChild(emptyMsg);
                }
            }

            // ---- Nashrlarni yuklash ----
            async function loadEditions() {
                try {
                    setStatus('⏳ Tafsir nashrlari yuklanmoqda…');
                    const resp = await fetch(`${BASE_URL}/editions.json`);
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    allEditions = await resp.json();

                    allEditions.sort((a, b) => a.language_name.localeCompare(b.language_name) || a.name.localeCompare(b.name));

                    editionSelect.innerHTML = '';
                    let firstSlug = null;

                    allEditions.forEach((ed) => {
                        const opt = document.createElement('option');
                        opt.value = ed.slug;
                        opt.textContent = `${ed.name} (${ed.language_name}) — ${ed.author_name}`;
                        editionSelect.appendChild(opt);
                        if (!firstSlug) firstSlug = ed.slug;
                    });

                    if (firstSlug) {
                        editionSelect.value = firstSlug;
                        currentEdition = firstSlug;
                    }

                    setStatus(`✅ ${allEditions.length} ta nashr yuklandi.`);

                    // Surah ro‘yxatini chizish
                    renderSurahList('');

                    // Avtomatik 1-surahni yuklash
                    if (editionSelect.value) {
                        await fetchTafsir(editionSelect.value, 1);
                    }

                } catch (err) {
                    console.error(err);
                    setStatus('❌ Nashrlarni yuklashda xatolik. Sahifani yangilang.', true);
                    editionSelect.innerHTML = '<option value="">Xatolik</option>';
                }
            }

            // ---- Event bog‘lash ----
            // 1. Nashr o‘zgarganda
            editionSelect.addEventListener('change', function() {
                if (this.value) {
                    fetchTafsir(this.value, currentSurah);
                }
            });

            // 2. Surah qidirish maydoni
            surahSearch.addEventListener('input', function() {
                renderSurahList(this.value);
            });

            // 3. Tafsir matnidan qidirish
            tafsirSearch.addEventListener('input', function() {
                renderTafsir(this.value);
            });

            // 4. Qidiruvni tozalash
            clearTafsirBtn.addEventListener('click', function() {
                tafsirSearch.value = '';
                renderTafsir('');
            });

            // ---- Ishga tushirish ----
            loadEditions();

        })();
    </script>

</body>
</html>
